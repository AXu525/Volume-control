<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>音量控制</title>
  <style>
    body {
      width: 280px;
      padding: 15px;
      font-family: 'Microsoft YaHei UI', sans-serif;
      font-size: 14px;
      margin: 0;
    }

    .header {
      text-align: center;
      margin-bottom: 15px;
      font-size: 16px;
      font-weight: bold;
      color: #333;
    }

    .volume-display {
      text-align: center;
      font-size: 36px;
      font-weight: bold;
      color: #0078d4;
      margin: 10px 0;
    }

    .volume-display span {
      font-size: 16px;
      color: #666;
    }

    .input-group {
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 15px 0;
    }

    .input-group label {
      margin-right: 10px;
    }

    .input-group input {
      width: 80px;
      padding: 5px;
      font-size: 16px;
      text-align: center;
      border: 1px solid #ccc;
      border-radius: 4px;
    }

    .input-group button {
      margin-left: 10px;
      padding: 5px 15px;
      background-color: #0078d4;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }

    .input-group button:hover {
      background-color: #005a9e;
    }

    .slider-group {
      margin: 15px 0;
    }

    .slider-group input[type="range"] {
      width: 100%;
      height: 8px;
      -webkit-appearance: none;
      background: #ddd;
      border-radius: 4px;
      outline: none;
    }

    .slider-group input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 20px;
      height: 20px;
      background: #0078d4;
      border-radius: 50%;
      cursor: pointer;
    }

    .status {
      text-align: center;
      color: #666;
      font-size: 12px;
      margin-top: 10px;
    }

    .status.error {
      color: #d32f2f;
    }

    .status.success {
      color: #388e3c;
    }
  </style>
</head>
<body>
  <div class="header">音量控制</div>

  <div class="volume-display">
    <span id="volumeValue">50</span><span>%</span>
  </div>

  <div class="input-group">
    <label for="volumeInput">输入音量:</label>
    <input type="number" id="volumeInput" min="0" max="100" value="50">
    <button id="applyBtn">应用</button>
  </div>

  <div class="slider-group">
    <input type="range" id="volumeSlider" min="0" max="100" value="50">
  </div>

  <div class="status" id="statusText">就绪</div>

  <script src="popup.js"></script>
</body>
</html>
